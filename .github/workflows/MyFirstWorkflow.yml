name: my-first-workflow
on: push
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 Checkout
        uses: actions/checkout@v6.1.0
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/lists.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload Single File
        uses: actions/upload-artifact@v7.0.2
        with:
          name: single-file
          path: ./myartifact.txt
      - name: Upload from directory
        uses: actions/upload-artifact@v7.0.2
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from Multiple paths
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
      - name: Multiple paths with exclusions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple-paths-with-exclusions
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: single-file
      - name: Checking current directory port download
        run: |
          pwd
          ls -ltr

        

