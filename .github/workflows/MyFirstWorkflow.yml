name: my-first-workflow
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    name: Running Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir ./reports/
          pytest --junitxml=./reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test_report
          path: reports/
          
