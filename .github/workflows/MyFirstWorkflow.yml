name: my-first-workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80
  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 Checkout
        uses: actions/checkout@v6.1.0
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/lists.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload Single File
        uses: actions/upload-artifact@v7.0.2
        with:
          name: single-file
          path: ./myartifact.txt
      - name: Upload from directory
        uses: actions/upload-artifact@v7.0.2
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from Multiple paths
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
      - name: Multiple paths with exclusions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple-paths-with-exclusions
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: single-file
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr
      - name: Referring environment variables
        run: |
          echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER."
          echo "[INFO] Once deployment application is accessible on port $APP_PORT."
      - name: Referring repository secrets
        run: |
          echo "[INFO] Application password is ${{ secrets.APP_PASSWORD }}."
  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps:
      - name: Referring context or in-built variables
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] New changes are added by ${{ github.actor }} in ${{ github.ref_name }} branch (${{ github.head_ref }})."
          echo "[INFO] Current step is running on ${{ runner.os }}."
          echo "[INFO] Current job id is ${{ job.check_run_id }}."
  staging:
    name: STAGE DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring environment variables
        run: echo "[INFO] Running deployment on ${{ vars.HOSTNAME }} using ${{ vars.USER }}."
      - name: Referring environment secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
    environment:
      name: STAGING
    if: github.ref_name == 'dev'
  production:
    name: PROD DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring environment variables
        run: echo "[INFO] Runnig deployment on ${{ vars.HOSTNAME }} using ${{ vars.USER }}."
      - name: Referring environment secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
    environment:
      name: PRODUCTION
    if: github.ref_name == 'main'
